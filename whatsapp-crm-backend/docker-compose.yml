  # ========================================
  # IndicTrans2 – separate file, no heredoc
  # ========================================
  indictrans:
    build:
      context: ../../call automation      # <-- folder that contains translate_api.py
      dockerfile: Dockerfile-translate
    container_name: whatsapp-crm-translate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '4'
        reservations:
          memory: 3G
          cpus: '2'
    networks:
      - whatsapp-crm-network



  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp-crm-db
    environment:
      POSTGRES_USER: ajsal
      POSTGRES_PASSWORD: "ajsalpv@4champz.in"
      POSTGRES_DB: whatsapp_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajsal -d whatsapp_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-crm-network
    restart: unless-stopped

  # Node.js Backend
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-crm-api
    depends_on:
      postgres:
        condition: service_healthy
      indictrans:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_USER: ajsal
      DB_HOST: postgres
      DB_NAME: whatsapp_crm
      DB_PASSWORD: "ajsalpv@4champz.in"
      DB_PORT: 5432
      PORT: 3000
      API_KEY: ${API_KEY:-your_secret_api_key_change_this}
      GROQ_API_KEY: ${GROQ_API_KEY:-your_groq_api_key}
      INDICTRANS_URL: http://indictrans:5000
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./server.js:/app/server.js:ro
      - ./package.json:/app/package.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - whatsapp-crm-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



